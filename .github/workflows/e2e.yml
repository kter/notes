name: E2E Tests

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - '.github/workflows/e2e.yml'
      - 'frontend/**'
      - 'Makefile'
      - 'README.md'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/e2e.yml'
      - 'frontend/**'
      - 'Makefile'
      - 'README.md'
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target environment'
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prd

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.target_env || 'dev' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TARGET_ENV: ${{ github.event.inputs.target_env || 'dev' }}

jobs:
  e2e-chromium:
    name: E2E (${{ matrix.label }})
    if: github.event_name != 'pull_request' || (github.event.pull_request.draft == false && github.event.pull_request.head.repo.fork == false)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: chromium
            project: chromium
            browser_install: chromium
            artifact_suffix: chromium
          - label: mobile-chrome
            project: Mobile Chrome
            browser_install: chromium
            artifact_suffix: mobile-chrome
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bun run playwright install --with-deps ${{ matrix.browser_install }}

      - name: Run Playwright tests
        run: bun run playwright test --project="${{ matrix.project }}"
        env:
          CI: true
          E2E_TARGET: ${{ env.TARGET_ENV }}
          E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ env.TARGET_ENV }}-${{ matrix.artifact_suffix }}
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

  e2e-webkit:
    name: E2E (${{ matrix.label }})
    if: github.event_name != 'pull_request' || (github.event.pull_request.draft == false && github.event.pull_request.head.repo.fork == false)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: webkit
            project: webkit
            artifact_suffix: webkit
          - label: mobile-safari
            project: Mobile Safari
            artifact_suffix: mobile-safari
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Bun archive dependency
        run: apt-get update && apt-get install --yes --no-install-recommends unzip
        working-directory: /

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Run Playwright tests
        run: bun run playwright test --project="${{ matrix.project }}"
        env:
          CI: true
          E2E_TARGET: ${{ env.TARGET_ENV }}
          E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ env.TARGET_ENV }}-${{ matrix.artifact_suffix }}
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
